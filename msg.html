<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Chat - WovenWonders</title>
    <link rel="stylesheet" href="style4.css">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <style>
        body { margin: 0; padding: 0; background: #f6f1ec; }
        .main { padding: 30px; }
        .chat-wrapper { background: white; border: 1px solid #E8D5C4; border-radius: 24px; padding: 18px; width: 80vh; height: 80vh; position: fixed; bottom: 20px; left: 50vh; box-shadow: 0 20px 40px rgba(0,0,0,0.12); display: flex; flex-direction: column; z-index: 999; }
        .chat-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 14px; }
        .chat-header h1 { margin: 0; color: #3B1406; font-size: 18px; }
        .chat-header p { margin: 4px 0 0; color: #8C6650; font-size: 13px; }
        .chat-content { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-right: 6px; }
        .chat-input-area { display: flex; gap: 10px; margin-top: 12px; }
        .chat-input-area input { flex: 1; padding: 12px 14px; border-radius: 999px; border: 1px solid #E8D5C4; outline: none; font-size: 14px; }
        .chat-input-area button { width: 46px; height: 46px; border: none; border-radius: 50%; background: #B84A1E; color: white; font-size: 18px; cursor: pointer; }
        .message { max-width: 100%; padding: 12px 14px; border-radius: 20px; line-height: 1.4; word-break: break-word; font-size: 14px; }
        .message.incoming { background: #f4f1ed; align-self: flex-start; }
        .message.outgoing { background: #B84A1E; color: white; align-self: flex-end; }
        .message.typing { background: #f7efe7; color: #3B1406; align-self: flex-start; font-style: italic; }
        .message.typing small { display: none; }
        .message img { max-width: 200px; max-height: 200px; border-radius: 12px; margin-top: 8px; }
        .image-upload-btn { width: 46px; height: 46px; border: none; border-radius: 50%; background: #8C6650; color: white; font-size: 18px; cursor: pointer; padding: 0; }
        #imageInput { display: none; }
        .chat-footer { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .chat-footer button { padding: 10px 14px; border-radius: 999px; border: none; background: #8C6650; color: white; cursor: pointer; font-size: 12px; }
        .sidebar .menu a.active { background: #5c2410; }
        @media (max-width: 900px) { .chat-wrapper { position: fixed; bottom: 10px; right: 10px; width: calc(100vw - 20px); max-height: 80vh; } .chat-input-area button { width: 48px; height: 48px; } }
    </style>
</head>
<body>
    <div class="layout">
        <div class="sidebar">
            <a href="home.html"><p class="logo">Woven<i style="color: #B84A1E;">Wonders</i></p><br></a>
                <p class="menu-title">MENU</p>
                <div class="menu">
                    <a href="dashboard.html" id="dashboardLink">Dashboard</a>
                    <a href="order.html" id="ordersLink">My Orders</a>
                    <a href="commission.html">Commission a Piece</a>
                    <a class="active">Messages</a>
                    <a href="settings.html">Settings</a>
                    <a href="market.html">Marketplace</a>
                <button onclick="logoutUser()" style="color: #8C6650; appearance: none; background: none; border: none; cursor: pointer; margin-left: 10px;">Log Out</button>
            </div>
        </div>
        <main class="main">
            <div class="chat-wrapper">
                <div class="chat-header">
                    <div>
                        <h1 id="chatTitle">Live Chat</h1>
                        <p id="chatSubtitle">Talk to the artist about your commission in real time.</p>
                    </div>
                    <button onclick="window.location.href='order.html'" id="backButton" style="padding: 10px 16px; background: #FDF3EF; color: #3B1406; border: 1px solid #E8D5C4; border-radius: 999px; cursor: pointer;">Back to Orders</button>
                </div>
                <div class="chat-content" id="chatContent"></div>
                <form class="chat-input-area" id="chatForm">
                    <input id="chatInput" type="text" placeholder="Type your message..." autocomplete="off">
                    <input type="file" id="imageInput" accept="image/*">
                    <button type="button" class="image-upload-btn" onclick="document.getElementById('imageInput').click()" title="Upload Image">🖼️</button>
                    <button type="submit">→</button>
                </form>
                <div class="chat-footer" id="quickReplies">
                    <button type="button" onclick="addQuickReply('Can you show me a progress update?')">Progress update</button>
                    <button type="button" onclick="addQuickReply('Please confirm the color details.')">Color details</button>
                    <button type="button" onclick="addQuickReply('When will this be finished?')">Delivery time</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        function logoutUser() {
            alert("Logging out...");
            window.location.href = "SignIn.html";
        }

        const chatForm = document.getElementById('chatForm');
        const chatInput = document.getElementById('chatInput');
        const chatContent = document.getElementById('chatContent');
        let messages = JSON.parse(localStorage.getItem('artistLiveChat') || '[]');
        const userInfo = JSON.parse(localStorage.getItem('userInfo') || '{}');
        const isSeller = userInfo.role === 'Seller/Artisan';

        // Adjust UI for seller
        if (isSeller) {
            document.getElementById('dashboardLink').href = 'seller.html';
            document.getElementById('ordersLink').href = 'order.html'; // Keep as is, or change to seller commissions
            document.getElementById('ordersLink').textContent = 'My Commissions';
            document.getElementById('chatTitle').textContent = 'Respond to Buyer';
            document.getElementById('chatSubtitle').textContent = 'Chat with your customer in real time.';
            document.getElementById('backButton').onclick = () => window.location.href = 'seller.html';
            document.getElementById('backButton').textContent = 'Back to Dashboard';
            document.getElementById('quickReplies').style.display = 'none'; // Hide quick replies for sellers
            chatInput.placeholder = 'Type your response...';
        }

        function getGreeting() {
            if (messages.length === 0 && !isSeller) {
                const now = new Date();
                messages.push({ type: 'incoming', text: 'Hello! I\'m your friendly mascot artsy. Let me know if you have any questions about your commission.', image: null, time: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) });
                localStorage.setItem('artistLiveChat', JSON.stringify(messages));
            }
        }

        function renderMessages() {
            chatContent.innerHTML = messages.map(msg => `
                <div class="message ${msg.type}">
                    ${msg.image ? `<img src="${msg.image}" alt="Shared image">` : ''}
                    <p>${msg.text || (msg.image ? 'Image' : '')}</p>
                    <small>${msg.time}</small>
                </div>
            `).join('');

            if (isTyping) {
                chatContent.innerHTML += `
                    <div class="message typing">
                        <p>Artist is typing...</p>
                    </div>
                `;
            }

            chatContent.scrollTop = chatContent.scrollHeight;
        }

        function addQuickReply(text) {
            chatInput.value = text;
            chatInput.focus();
        }

        const responseDelayMs = 2000;
        let responseTimeoutId = null;
        let isTyping = false;
        const imageInput = document.getElementById('imageInput');

        // Handle image upload
        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const now = new Date();
                    const timestamp = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    const messageType = isSeller ? 'incoming' : 'outgoing';
                    messages.push({
                        type: messageType,
                        text: '',
                        image: event.target.result,
                        time: timestamp
                    });
                    localStorage.setItem('artistLiveChat', JSON.stringify(messages));
                    renderMessages();
                    imageInput.value = ''; // Reset file input
                };
                reader.readAsDataURL(file);
            }
        });

        function simulateResponse(userText) {
            const lower = userText.toLowerCase();
            let response = 'Thanks for the update! I\'ll review that and send you a progress note soon.';
            if (lower.includes('progress')) {
                response = 'I\'m currently at 40% on your piece. I\'ll send a photo as soon as it reaches 70%.';
            } else if (lower.includes('color')) {
                response = 'I\'ll use the palette you requested and confirm the exact shade before stitching.';
            } else if (lower.includes('finish') || lower.includes('when')) {
                response = 'The work is on schedule. I expect it to be ready by the deadline you shared.';
            } else if (lower.includes('hello') || lower.includes('hi') || lower.includes('hey')) {
                response = 'Hi there! How can I help with your commission today?';
            }
            return response;
        }

        function showTypingIndicator() {
            isTyping = true;
            renderMessages();
        }

        function hideTypingIndicator() {
            isTyping = false;
            renderMessages();
        }

        chatForm.addEventListener('submit', event => {
            event.preventDefault();
            const text = chatInput.value.trim();
            if (!text) return;
            const now = new Date();
            const timestamp = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const messageType = isSeller ? 'incoming' : 'outgoing';
            messages.push({ type: messageType, text, image: null, time: timestamp });
            localStorage.setItem('artistLiveChat', JSON.stringify(messages));
            chatInput.value = '';
            renderMessages();

            if (!isSeller) {
                showTypingIndicator();

                if (responseTimeoutId) {
                    clearTimeout(responseTimeoutId);
                }

                responseTimeoutId = setTimeout(() => {
                    hideTypingIndicator();
                    const reply = simulateResponse(text);
                    const nowResponse = new Date();
                    const responseTimestamp = nowResponse.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    messages.push({ type: 'incoming', text: reply, image: null, time: responseTimestamp });
                    localStorage.setItem('artistLiveChat', JSON.stringify(messages));
                    renderMessages();
                }, responseDelayMs);
            }
        });

        getGreeting();
        renderMessages();
    </script>
</body>
</html>
